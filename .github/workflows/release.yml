name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: rustop

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          staging="${BIN_NAME}-${REF_NAME}-${TARGET}"
          mkdir "$staging"
          cp "target/${TARGET}/release/${BIN_NAME}" "$staging/"
          cp LICENSE README.md "$staging/" 2>/dev/null || true
          tar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          echo "archive=${staging}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${staging}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.checksum }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ env.BIN_NAME }}-${{ env.RELEASE_TAG }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/${{ env.BIN_NAME }}-${{ env.RELEASE_TAG }}.cyclonedx.json

      - name: Keylessly attest release archives with Cosign
        shell: bash
        env:
          SBOM_PATH: dist/${{ env.BIN_NAME }}-${{ env.RELEASE_TAG }}.cyclonedx.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            echo "No release archives found to attest" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            cosign attest-blob --yes \
              --predicate "$SBOM_PATH" \
              --type cyclonedx \
              --bundle "${archive}.sbom.sigstore.json" \
              "$archive"
          done

      - name: Attach binaries and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # release-plz creates the release as a draft so this workflow can
          # attach the platform binaries before it goes public. If the draft
          # is missing (release-plz failed, or the tag was pushed manually),
          # fall back to creating the release from the CHANGELOG section for
          # this version. RELEASE_TAG comes from the tag ref / a validated
          # workflow_dispatch input, matching GitHub's own tag_name rules.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            VERSION="${RELEASE_TAG#v}"
            NOTES_FILE="$(mktemp)"
            awk -v v="## \\[$VERSION\\]" '
              $0 ~ v {flag=1; next}
              /^## \[/ {flag=0}
              flag {print}
            ' CHANGELOG.md > "$NOTES_FILE"
            if [ ! -s "$NOTES_FILE" ]; then
              echo "Release $RELEASE_TAG missing and no CHANGELOG section found for $VERSION" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$NOTES_FILE" --draft
          fi
          gh release upload "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/*.sha256 \
            dist/*.cyclonedx.json \
            dist/*.sigstore.json \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false
